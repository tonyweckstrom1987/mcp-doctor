name: MCP Doctor Health Check
description: "Health check for MCP servers: handshake, tool schema lint and smoke calls. Fails the workflow on findings."
author: tonyweckstrom1987

branding:
  icon: activity
  color: blue

inputs:
  command:
    description: Start command for a stdio server (e.g. "node dist/index.js"). The command is split on spaces and quotes are not interpreted (if you need them, put the start command in a script file). Use this or the url input.
    required: false
    default: ""
  url:
    description: Address of a Streamable HTTP server (e.g. http://localhost:3000/mcp). Use this or the command input.
    required: false
    default: ""
  smoke:
    description: Path to a smoke file (JSON). Only the tools named in it are called.
    required: false
    default: ""
  strict:
    description: 'If "true", warnings fail the run too.'
    required: false
    default: "false"
  timeout-ms:
    description: Timeout for a single request in milliseconds.
    required: false
    default: "10000"
  env-names:
    description: Space-separated names of environment variables passed to the stdio server (set the values in the env block of the action step). The server sees no other variables.
    required: false
    default: ""
  auth:
    description: 'If "true" and url is given, also checks the OAuth setup (401, metadata, PKCE, refresh_token) without logging in.'
    required: false
    default: "false"
  max-tokens:
    description: Token budget. The run fails if the estimated total size of the tool definitions exceeds it. Empty = no budget; the size is reported anyway.
    required: false
    default: ""
  bearer-env:
    description: Name of the environment variable holding the Bearer token for the HTTP server (set it from a secret in the env block of this step).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install and build mcp-doctor
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund

    - name: Run mcp-doctor
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_SMOKE: ${{ inputs.smoke }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_TIMEOUT: ${{ inputs.timeout-ms }}
        INPUT_BEARER_ENV: ${{ inputs.bearer-env }}
        INPUT_ENV_NAMES: ${{ inputs.env-names }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_AUTH: ${{ inputs.auth }}
      run: |
        # Syötteet välitetään ympäristömuuttujina, ei suoraan komentoriville (ei komentoinjektiota).
        args=()
        [ "$INPUT_STRICT" = "true" ] && args+=(--strict)
        [ -n "$INPUT_SMOKE" ] && args+=(--smoke "$INPUT_SMOKE")
        args+=(--timeout-ms "$INPUT_TIMEOUT")
        [ -n "$INPUT_MAX_TOKENS" ] && args+=(--max-tokens "$INPUT_MAX_TOKENS")
        if [ -n "$INPUT_URL" ]; then
          [ -n "$INPUT_COMMAND" ] && { echo "Give either command or url, not both" >&2; exit 2; }
          [ -n "$INPUT_ENV_NAMES" ] && { echo "env-names applies only to command servers" >&2; exit 2; }
          [ -n "$INPUT_BEARER_ENV" ] && args+=(--bearer-env "$INPUT_BEARER_ENV")
          [ "$INPUT_AUTH" = "true" ] && args+=(--auth)
          args+=(--url "$INPUT_URL")
        else
          [ -z "$INPUT_COMMAND" ] && { echo "Give command or url" >&2; exit 2; }
          [ -n "$INPUT_BEARER_ENV" ] && { echo "bearer-env applies only to url servers" >&2; exit 2; }
          [ "$INPUT_AUTH" = "true" ] && { echo "auth applies only to url servers" >&2; exit 2; }
          set -f # ei tiedostonimilaajennusta (esim. env-names: "*")
          for name in $INPUT_ENV_NAMES; do
            [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "Invalid environment variable name: $name" >&2; exit 2; }
            args+=(--env "$name")
          done
          read -ra cmd <<< "$INPUT_COMMAND"
          args+=(-- "${cmd[@]}")
        fi
        node "$GITHUB_ACTION_PATH/dist/bin.js" "${args[@]}"
