name: MCP Doctor Health Check
description: "Health check for MCP servers: handshake, tool schema lint and smoke calls. Fails the workflow on findings."
author: tonyweckstrom1987

branding:
  icon: activity
  color: blue

inputs:
  command:
    description: Käynnistyskomento stdio-palvelimelle (esim. "node dist/index.js"). Komento pilkotaan välilyönneistä, lainausmerkkejä ei tulkita (jos tarvitset niitä, kirjoita käynnistys skriptitiedostoon). Käytä tätä tai url-syötettä.
    required: false
    default: ""
  url:
    description: Streamable HTTP -palvelimen osoite (esim. http://localhost:3000/mcp). Käytä tätä tai command-syötettä.
    required: false
    default: ""
  smoke:
    description: Polku savuajotiedostoon (JSON). Vain siinä nimetyt työkalut kutsutaan.
    required: false
    default: ""
  strict:
    description: 'Jos "true", varoituksetkin kaatavat ajon.'
    required: false
    default: "false"
  timeout-ms:
    description: Yksittäisen pyynnön aikakatkaisu millisekunteina.
    required: false
    default: "10000"
  env-names:
    description: Välilyönnillä erotetut ympäristömuuttujien nimet, jotka välitetään stdio-palvelimelle (aseta arvot action-askeleen env-lohkossa). Muita muuttujia palvelin ei näe.
    required: false
    default: ""
  auth:
    description: 'Jos "true" ja url on annettu, tarkistetaan myös OAuth-asetukset (401, metatiedot, PKCE, refresh_token) kirjautumatta.'
    required: false
    default: "false"
  max-tokens:
    description: Tokenimittarin raja. Jos työkalumäärittelyjen arvioitu yhteiskoko ylittää rajan, ajo kaatuu. Tyhjä = ei rajaa, koko raportoidaan silti.
    required: false
    default: ""
  bearer-env:
    description: Ympäristömuuttujan nimi, josta HTTP-palvelimen Bearer-token luetaan (aseta muuttuja tämän askeleen env-lohkossa secretistä).
    required: false
    default: ""

  sarif:
    description: Polku, johon löydökset kirjoitetaan SARIF 2.1.0 -tiedostona (esim. mcp-doctor.sarif). Tiedoston voi ladata github/codeql-action/upload-sarif-askeleella. Julkaisematon ominaisuus.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Asenna ja käännä mcp-doctor
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund

    - name: Aja mcp-doctor
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_SMOKE: ${{ inputs.smoke }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_TIMEOUT: ${{ inputs.timeout-ms }}
        INPUT_BEARER_ENV: ${{ inputs.bearer-env }}
        INPUT_ENV_NAMES: ${{ inputs.env-names }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_AUTH: ${{ inputs.auth }}
        INPUT_SARIF: ${{ inputs.sarif }}
      run: |
        # Syötteet välitetään ympäristömuuttujina, ei suoraan komentoriville (ei komentoinjektiota).
        args=()
        [ "$INPUT_STRICT" = "true" ] && args+=(--strict)
        [ -n "$INPUT_SMOKE" ] && args+=(--smoke "$INPUT_SMOKE")
        args+=(--timeout-ms "$INPUT_TIMEOUT")
        [ -n "$INPUT_MAX_TOKENS" ] && args+=(--max-tokens "$INPUT_MAX_TOKENS")
        [ -n "$INPUT_SARIF" ] && args+=(--sarif "$INPUT_SARIF")
        if [ -n "$INPUT_URL" ]; then
          [ -n "$INPUT_COMMAND" ] && { echo "Anna joko command tai url, ei molempia" >&2; exit 2; }
          [ -n "$INPUT_ENV_NAMES" ] && { echo "env-names koskee vain command-palvelinta" >&2; exit 2; }
          [ -n "$INPUT_BEARER_ENV" ] && args+=(--bearer-env "$INPUT_BEARER_ENV")
          [ "$INPUT_AUTH" = "true" ] && args+=(--auth)
          args+=(--url "$INPUT_URL")
        else
          [ -z "$INPUT_COMMAND" ] && { echo "Anna command tai url" >&2; exit 2; }
          [ -n "$INPUT_BEARER_ENV" ] && { echo "bearer-env koskee vain url-palvelinta" >&2; exit 2; }
          [ "$INPUT_AUTH" = "true" ] && { echo "auth koskee vain url-palvelinta" >&2; exit 2; }
          set -f # ei tiedostonimilaajennusta (esim. env-names: "*")
          for name in $INPUT_ENV_NAMES; do
            [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "Virheellinen ympäristömuuttujan nimi: $name" >&2; exit 2; }
            args+=(--env "$name")
          done
          read -ra cmd <<< "$INPUT_COMMAND"
          args+=(-- "${cmd[@]}")
        fi
        node "$GITHUB_ACTION_PATH/dist/bin.js" "${args[@]}"
