name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Aseta Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Tarkista tuotantoriippuvuuksien haavoittuvuudet
        run: npm audit --omit=dev --audit-level=high

      - name: Tyyppitarkistus
        run: npm run typecheck

      - name: Käännä
        run: npm run build

      - name: Testit
        run: npm test

      - name: Oma työkalu omaa testipalvelinta vastaan
        run: node dist/bin.js --strict -- node test/fixtures/good-server.mjs

  action:
    # Varmistaa, että repon oma GitHub Action toimii: sama polku kuin ulkopuolisella käyttäjällä.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Aja action kunnossa olevaa palvelinta vastaan
        uses: ./
        with:
          command: node test/fixtures/good-server.mjs
          smoke: test/fixtures/good-smoke.json
          strict: "true"

      - name: Aja action ympäristömuuttujilla (vain nimetty muuttuja välittyy palvelimelle)
        uses: ./
        env:
          VALITETTU: nakyy
          SALAINEN_ARVO: ei-saa-nakya
        with:
          command: node test/fixtures/env-probe-server.mjs
          env-names: VALITETTU
          smoke: test/fixtures/env-smoke.json
          strict: "true"

  paketti:
    # Testaa sen, mitä käyttäjä oikeasti saa npm:stä: pakkaa, asenna puhtaaseen kansioon, aja.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Asenna, käännä ja pakkaa
        run: |
          npm ci
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Asenna paketti puhtaaseen kansioon ja aja
        run: |
          mkdir "$RUNNER_TEMP/asennus" && cd "$RUNNER_TEMP/asennus"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/tonyweckstrom-mcp-doctor-*.tgz
          test "$(npx mcp-doctor --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          npx mcp-doctor --strict -- node "$GITHUB_WORKSPACE/test/fixtures/good-server.mjs"
