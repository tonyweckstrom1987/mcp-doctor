name: Free MCP health check
description: Ask for a free health check of your MCP server
title: "Health check: <repo name>"
labels: ["health-check"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking for a health check. The maintainer runs `mcp-doctor` against your server in an isolated sandbox and replies with the findings.
        Only public repositories can be checked. Do not paste secrets, tokens or private URLs into this form.
  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      description: Public GitHub repository of the MCP server.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: start-command
    attributes:
      label: Start command or server URL
      description: The command that starts the server over stdio (for example `node dist/server.js`), or the URL of a public HTTP endpoint.
      placeholder: node dist/server.js
    validations:
      required: true
  - type: dropdown
    id: public-reply
    attributes:
      label: Public reply
      description: Do you want the findings posted in this issue?
      options:
        - "Yes, reply publicly in this issue"
        - "No, I prefer a short summary only"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I agree that the server code is installed and run in an isolated environment without network access to private systems.
          required: true
        - label: The server does not need secrets to start, and I have not included any in this issue.
          required: true
